services:
  postgres:
    image: postgres:16-alpine
    container_name: gitly-postgres
    environment:
      POSTGRES_DB: gitly
      POSTGRES_USER: gitly
      POSTGRES_PASSWORD: gitlypassword
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitly -d gitly"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gitly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gitly.ai
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: Asia/Kolkata
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gitly-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gitly
      SPRING_DATASOURCE_USERNAME: gitly
      SPRING_DATASOURCE_PASSWORD: gitlypassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CACHE_RETENTION_HOURS: ${CACHE_RETENTION_HOURS:-48}
      TZ: Asia/Kolkata
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/repositories/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gitly-frontend
    environment:
      - BACKEND_URL=http://backend:8080
      - TZ=Asia/Kolkata
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
