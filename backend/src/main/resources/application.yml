server:
  port: ${PORT:8080}

spring:
  application:
    name: gitly-backend

gitly:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  storage:
    clone-dir: ${CLONE_DIR:${java.io.tmpdir}/gitly-repos}

repomind:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  storage:
    clone-dir: ${CLONE_DIR:${java.io.tmpdir}/gitly-repos}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

